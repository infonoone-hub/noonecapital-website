<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <defs>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e2c15"/>
      <stop offset="100%" stop-color="#a86c3c"/>
    </linearGradient>
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b3e22"/>
      <stop offset="100%" stop-color="#c08a5a"/>
    </linearGradient>
  </defs>

  <!-- Diamond mark -->
  <g transform="translate(30,30)">
    <!-- Outer diamond -->
    <rect x="-19" y="-19" width="38" height="38" rx="4" ry="4"
          transform="rotate(45)"
          fill="url(#diamondGrad)"/>
    <!-- N letterform inside diamond -->
    <g fill="none" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="-8" y1="9" x2="-8" y2="-9"/>
      <line x1="-8" y1="-9" x2="8" y2="9"/>
      <line x1="8" y1="9" x2="8" y2="-9"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(68, 0)">
    <!-- NOONE -->
    <text x="0" y="34"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="22"
          font-weight="700"
          letter-spacing="3"
          fill="#2d1a0a">NOONE</text>
    <!-- CAPITAL -->
    <text x="1" y="50"
          font-family="'Inter', Arial, sans-serif"
          font-size="9.5"
          font-weight="500"
          letter-spacing="6"
          fill="#a86c3c">CAPITAL</text>
    <!-- Thin rule between words -->
    <line x1="0" y1="37" x2="118" y2="37" stroke="#c08a5a" stroke-width="0.6" opacity="0.6"/>
  </g>
</svg>
